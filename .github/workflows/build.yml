name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "$(ls MusicFlow-android*.zip | head -n 1)" -d app_src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: gradle assembleRelease --no-daemon
        working-directory: app_src
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-APK
          path: app_src/app/build/outputs/apk/release/*.apk
